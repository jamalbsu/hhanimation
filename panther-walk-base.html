<title>Moonlit Panther</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* One full-bleed canvas stage; a single "tap to begin" veil for sound. Night-only look. */
  :root {
    --bg: #070a12;
    --ink: #cfdcff;
    --ink-dim: rgba(207, 220, 255, 0.55);
    --veil: rgba(5, 7, 14, 0.62);
    --font-ui: "Segoe UI", system-ui, -apple-system, sans-serif;
    color-scheme: dark;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
  body { font-family: var(--font-ui); cursor: none; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  #overlay {
    position: fixed; inset: 0; z-index: 10; cursor: pointer;
    display: flex; flex-direction: column; gap: 12px; align-items: center; justify-content: center; text-align: center;
    background: var(--veil); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    transition: opacity 0.9s;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #overlay .go { color: var(--ink); font-weight: 300; font-size: 1.2rem; letter-spacing: 0.2em; text-transform: uppercase; animation: pulse 2.2s ease-in-out infinite; }
  #overlay .sub { color: var(--ink-dim); font-size: 0.85rem; letter-spacing: 0.04em; }
  @keyframes pulse { 0%, 100% { opacity: .45 } 50% { opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { #overlay .go { animation: none; } }
  body.clean #overlay { display: none; }
</style>

<canvas id="c"></canvas>
<div id="overlay" role="button" tabindex="0" aria-label="Start with sound">
  <span class="go">Tap to begin</span>
  <span class="sub">Night jungle sounds</span>
</div>

<script>
// ============================================================================
//  Moonlit Panther — a black panther walking endlessly through a night jungle.
//  Everything is drawn from code (vector paths) each frame.
//  Rig: a 2D skeleton with a lateral-sequence walk (LH → LF → RH → RF),
//  2-bone IK for each leg, flexing spine, rolling shoulder blades, swaying tail.
// ============================================================================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const DEG = Math.PI / 180;

// ---- timing: everything repeats every LOOP seconds, so a render loops seamlessly
const T = 1.5;                 // one full stride cycle (s)
const LOOP = T * 24;           // 36 s
const W0 = TAU / LOOP;
const DUTY = 0.64;             // share of the cycle each paw is on the ground
const STRIDE = 112;            // paw travel per stance, in body units
const V = STRIDE / (DUTY * T); // ground speed, body units / s

const params = new URLSearchParams(location.search);
if (params.has('clean')) document.body.classList.add('clean');
const T0 = +(params.get('t0') || 0);

// ---- helpers
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = x => x * x * (3 - 2 * x);
const frac = x => x - Math.floor(x);
const dir = a => [Math.cos(a * DEG), Math.sin(a * DEG)];
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function keyframes(k, s) {                  // k = [[s0,v0],[s1,v1],...], smooth between keys
  for (let i = 0; i < k.length - 1; i++) if (s <= k[i + 1][0]) {
    const u = (s - k[i][0]) / (k[i + 1][0] - k[i][0]);
    return lerp(k[i][1], k[i + 1][1], smooth(clamp(u)));
  }
  return k[k.length - 1][1];
}
function splinePath(c, pts, closed = true) {   // Catmull-Rom through points
  const n = pts.length, P = i => pts[closed ? (i + n) % n : clamp(i, 0, n - 1)];
  c.moveTo(pts[0][0], pts[0][1]);
  for (let i = 0; i < (closed ? n : n - 1); i++) {
    const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
    c.bezierCurveTo(p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6,
                    p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6, p2[0], p2[1]);
  }
  if (closed) c.closePath();
}
function capsule(c, ax, ay, ar, bx, by, br) {     // tapered limb segment
  const dx = bx - ax, dy = by - ay, d = Math.hypot(dx, dy) || 1e-3, a = Math.atan2(dy, dx);
  const s = Math.asin(clamp((ar - br) / d, -1, 1));
  c.beginPath();
  c.arc(ax, ay, ar, a + Math.PI / 2 - s, a + Math.PI * 1.5 + s);
  c.arc(bx, by, br, a - Math.PI / 2 + s, a + Math.PI / 2 - s);
  c.closePath(); c.fill();
}
function ik(ax, ay, bx, by, l1, l2, bend) {       // 2-bone IK → middle joint
  const dx = bx - ax, dy = by - ay, d = Math.hypot(dx, dy), base = Math.atan2(dy, dx);
  if (d >= l1 + l2 - 0.01) { const r = l1 / (l1 + l2); return [ax + dx * r, ay + dy * r]; }
  const a = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));
  return [ax + l1 * Math.cos(base + bend * a), ay + l1 * Math.sin(base + bend * a)];
}

// ---- gait ---------------------------------------------------------------------
// Panther faces right; the viewer sees its left side, so L legs are near, R legs far.
// Hind paws are centred just behind the hip (x0 = -105, hip at -93) so each one lands
// roughly in the print the fore paw on the same side just left, and pushes off behind the rump.
const LEGS = [
  { id: 'RH', far: true,  hind: true,  off: 0.50, x0: -105 },
  { id: 'RF', far: true,  hind: false, off: 0.75, x0: 104 },
  { id: 'LH', far: false, hind: true,  off: 0.00, x0: -105 },
  { id: 'LF', far: false, hind: false, off: 0.25, x0: 104 },
];
const HIP = [-93, -130];                 // hip joint, body coords
const THIGH = 54, SHIN = 58, METATARSUS = 36;
// paw "roll" angle (deg) over the swing: lifts, curls back, reaches forward, plants
const FRONT_SWING = [[0, 116], [0.3, 168], [0.62, 95], [0.86, 58], [1, 70]];
const HIND_SWING  = [[0, 116], [0.32, 150], [0.66, 80], [0.88, 60], [1, 68]];   // starts/ends where the stance angle does

function footState(leg, c) {                 // c = walk cycles so far
  const p = frac(c + leg.off);
  if (p < DUTY) {
    const s = p / DUTY;
    return { fx: leg.x0 + STRIDE * (0.5 - s), fy: 0, stance: true, s,
             ang: leg.hind ? 68 + 48 * s * s : 70 + 46 * s * s };
  }
  const s = (p - DUTY) / (1 - DUTY);
  const e = s - Math.sin(TAU * s) / TAU;
  const lift = leg.hind ? 17 : 22;
  return { fx: leg.x0 + STRIDE * (-0.5 + e), fy: -lift * Math.sin(Math.PI * Math.pow(s, 0.8)), stance: false, s,
           ang: keyframes(leg.hind ? HIND_SWING : FRONT_SWING, s) };
}

// ---- curve helpers ---------------------------------------------------------------
function cr(p0, p1, p2, p3, u) {              // Catmull-Rom on numbers
  const u2 = u * u, u3 = u2 * u;
  return 0.5 * (2 * p1 + (p2 - p0) * u + (2 * p0 - 5 * p1 + 4 * p2 - p3) * u2 + (3 * p1 - p0 - 3 * p2 + p3) * u3);
}
function keyCR(k, s) {                         // smooth curve through [time, value] keys
  if (s <= k[0][0]) return k[0][1];
  if (s >= k[k.length - 1][0]) return k[k.length - 1][1];
  let i = 0; while (s > k[i + 1][0]) i++;
  const u = (s - k[i][0]) / (k[i + 1][0] - k[i][0]);
  const v = j => k[clamp(j, 0, k.length - 1)][1];
  return cr(v(i - 1), v(i), v(i + 1), v(i + 2), u);
}
function keyP(k, s) {                          // same, repeating; first and last key hold the same value
  s = frac(s); const n = k.length - 1;
  let i = 0; while (i < n - 1 && s > k[i + 1][0]) i++;
  const u = (s - k[i][0]) / (k[i + 1][0] - k[i][0]);
  const v = j => k[((j % n) + n) % n][1];
  return cr(v(i - 1), v(i), v(i + 1), v(i + 2), u);
}
function keyPts(k, s) {                        // same, for [time, [x, y]] keys
  return [0, 1].map(d => keyCR(k.map(([j, p]) => [j, p[d]]), s));
}
function toLocal(xw, yw, L, Pd) {              // ground coords → panther body coords (lift L, pitch Pd°)
  const a = -Pd * DEG, x = xw, y = yw - L + 120;
  return [x * Math.cos(a) - y * Math.sin(a), x * Math.sin(a) + y * Math.cos(a) - 120];
}
function toWorld(x, y, L, Pd) {
  const a = Pd * DEG, Y = y + 120;
  return [x * Math.cos(a) - Y * Math.sin(a), x * Math.sin(a) + Y * Math.cos(a) - 120 + L];
}

// ---- the story: one run of the animation, then it fades and starts over ----------
// walk → speed up → gallop → leap a log → gallop → leap a bigger log → gallop → slow down → stop → lie down → rest
const STORY = 34, FIN = 1.2, FOUT = 2.0, SEND = +(params.get('end') || STORY);   // ?end=N cuts the story short with a fade at N s
const RUN_V = 540;                    // gallop speed, body units / s
const SG = 330;                       // gallop stride: distance covered per gallop cycle
const EVT = { acc0: 1.0, acc1: 3.4, slow0: 12.6, slow1: 15.4, lie0: 16.4, lie1: 19.2 };
const JUMPS = [
  { t: 6.0, D: 0.85, sp: 260, amp: 0.9, half: 58, r: 21 },
  { t: 9.6, D: 0.9,  sp: 260, amp: 1.0, half: 64, r: 25 },
];
let SD = 0, STL = 0;                  // scenery distance and story time for the frame being drawn

function speedAt(t) {
  if (t < EVT.acc0) return V;
  if (t < EVT.acc1) return lerp(V, RUN_V, smooth((t - EVT.acc0) / (EVT.acc1 - EVT.acc0)));
  if (t < EVT.slow0) return RUN_V;
  if (t < EVT.slow1) return RUN_V * Math.pow(1 - (t - EVT.slow0) / (EVT.slow1 - EVT.slow0), 1.5);
  return 0;
}
const TAB_DT = 1 / 120, TAB_N = Math.ceil(STORY / TAB_DT) + 2;
const TAB = { d: new Float64Array(TAB_N), w: new Float64Array(TAB_N), g: new Float64Array(TAB_N), v: new Float64Array(TAB_N) };
(function buildTable() {              // distance, walk cycles and gallop cycles, integrated once
  let d = 0, w = 0, g = 0;
  for (let i = 0; i < TAB_N; i++) {
    const v = speedAt(i * TAB_DT);
    TAB.d[i] = d; TAB.w[i] = w; TAB.g[i] = g; TAB.v[i] = v;
    d += v * TAB_DT; w += v * DUTY / STRIDE * TAB_DT; g += v / SG * TAB_DT;
  }
})();
function tab(a, t) { const x = clamp(t / TAB_DT, 0, TAB_N - 2), i = Math.floor(x); return lerp(a[i], a[i + 1], x - i); }
JUMPS.forEach(j => { j.logD = tab(TAB.d, j.t + 0.5 * j.D) + 20; });     // each log lies where its leap passes over it

function weights(t) {
  const v = tab(TAB.v, t);
  const wG = smooth(clamp((v - 230) / 110));
  const sStand = smooth(clamp((90 - v) / 60));
  return { v, wG, wStand: sStand * (1 - wG), wWalk: (1 - wG) * (1 - sStand) };
}

// ---- gallop ----------------------------------------------------------------------
const G_STANCE = { LH: [0.00, 0.24], RH: [0.06, 0.24], RF: [0.38, 0.22], LF: [0.45, 0.22] };   // [touchdown, duty] per cycle
const G_XC = { hind: -69, fore: 112 };
const G_SWING = {          // [progress, x, height] — paws stretch back, tuck under, reach forward
  hind: [[0, -109, 0], [0.2, -145, 26], [0.5, -77, 40], [0.8, -17, 24], [1, -29, 0]],
  fore: [[0, 76, 0], [0.3, 60, 38], [0.55, 90, 44], [0.85, 170, 30], [1, 148, 0]],
};
const G_LIFT  = [[0, -3], [0.15, -9], [0.3, -24], [0.4, -14], [0.55, -4], [0.68, -8], [0.8, -22], [0.92, -12], [1, -3]];
const G_PITCH = [[0, 2], [0.15, -4], [0.3, -6], [0.42, 5], [0.55, 6], [0.7, -2], [0.82, -3], [0.95, 3], [1, 2]];
const G_FLEX  = [[0, 0], [0.3, -1], [0.55, 0], [0.8, 1], [1, 0]];          // + = back arched (paws gathered), − = stretched out
const G_X = { hind: G_SWING.hind.map(r => [r[0], r[1]]), fore: G_SWING.fore.map(r => [r[0], r[1]]) };
const G_H = { hind: G_SWING.hind.map(r => [r[0], r[2]]), fore: G_SWING.fore.map(r => [r[0], r[2]]) };
function gallopFoot(L, g) {
  const [s0, duty] = G_STANCE[L.id], p = frac(g - s0), kind = L.hind ? 'hind' : 'fore';
  const xc = G_XC[kind], disp = SG * duty;
  if (p < duty) {
    const s = p / duty;
    return { x: xc + disp * (0.5 - s), h: 0, ang: L.hind ? 68 + 48 * s * s : 70 + 46 * s * s };
  }
  const s = (p - duty) / (1 - duty);
  return { x: keyCR(G_X[kind], s), h: keyCR(G_H[kind], s), ang: keyframes(L.hind ? HIND_SWING : FRONT_SWING, s) };
}

// ---- the leap ------------------------------------------------------------------
// J runs 0 → 1 over the jump. The body gets a lift (+y = down) and a pitch (deg, + = nose down)
// about a pivot in the middle of the torso; paws are planned in ground coordinates.
const LIFT_K  = [[0, 0], [0.2, 10], [0.32, 3], [0.48, -52], [0.6, -32], [0.68, -9], [0.78, 9], [0.9, 2], [1, 0]];
const PITCH_K = [[0, 0], [0.2, -3], [0.34, -16], [0.48, -2], [0.6, 11], [0.68, 12], [0.8, 1], [0.9, -2], [1, 0]];
const BLEND_K = [[0, 0], [0.12, 1], [0.86, 1], [1, 0]];
const FLIGHT_K = [[0, 0], [0.3, 0], [0.45, 1], [0.66, 1], [0.84, 0], [1, 0]];
const jumpLift = J => keyCR(LIFT_K, J), jumpPitch = J => keyCR(PITCH_K, J);
function jumpFoot(L, J, sp, amp) {
  const dx = L.far ? (L.hind ? 8 : 10) : 0;
  const loc = (xw, j) => toLocal(xw, -7.5, jumpLift(j) * amp, jumpPitch(j) * amp);
  if (L.hind) {
    const TO = 0.34, LD = 0.78;
    const A = j => -67 + dx - sp * j, B = j => 31 + dx - sp * (j - LD);
    const ang = keyCR([[0, 68], [0.22, 76], [0.34, 128], [0.46, 142], [0.64, 96], [0.78, 66], [0.9, 72], [1, 68]], J);
    const p = J <= TO ? loc(A(J), J) : J >= LD ? loc(B(J), J)
      : keyPts([[TO, loc(A(TO), TO)], [0.47, [-155 + dx, -56]], [0.64, [-65 + dx, -50]], [LD, loc(B(LD), LD)]], J);
    return { x: p[0], y: p[1], ang };
  }
  const LO = 0.22, LDf = 0.66;
  const A = j => 62 + dx - sp * j, B = j => 152 + dx - sp * (j - LDf);
  const ang = keyCR([[0, 70], [0.22, 112], [0.36, 168], [0.54, 52], [0.66, 70], [0.8, 106], [1, 80]], J);
  const p = J <= LO ? loc(A(J), J) : J >= LDf ? loc(B(J), J)
    : keyPts([[LO, loc(A(LO), LO)], [0.36, [128 + dx, -82]], [0.54, [188 + dx, -40]], [LDf, loc(B(LDf), LDf)]], J);
  return { x: p[0], y: p[1], ang };
}

// ---- resting poses -------------------------------------------------------------
const STAND_DX = { LH: 6, RH: -6, LF: -12, RF: 2 };   // standing square: hind paws under the hips, fore paws under the shoulders
const L_LIE = 66, P_LIE = -3;          // body lowered onto the ground, chest a touch high (sphinx pose)
const LIE_FEET = (() => {
  const spec = { LH: [-34, 4], RH: [-50, 4], LF: [168, 8], RF: [152, 8] }, o = {};
  for (const id in spec) { const p = toLocal(spec[id][0], -7.5, L_LIE, P_LIE); o[id] = { x: p[0], y: p[1], ang: spec[id][1] - P_LIE }; }
  return o;
})();

// ---- sound events, found by scanning the gait table once -------------------------
const EVENTS = (() => {
  const ev = [], inAir = t => JUMPS.some(j => t > j.t + 0.12 * j.D && t < j.t + 0.9 * j.D);
  for (let i = 1; i < TAB_N; i++) {
    const t = i * TAB_DT, w = weights(t);
    if (inAir(t)) continue;
    for (const L of LEGS) {
      if (w.wWalk > 0.5 && Math.floor(TAB.w[i] + L.off) > Math.floor(TAB.w[i - 1] + L.off)) ev.push({ t, k: 'walk', near: !L.far });
      if (w.wG > 0.5 && Math.floor(TAB.g[i] - G_STANCE[L.id][0]) > Math.floor(TAB.g[i - 1] - G_STANCE[L.id][0])) ev.push({ t, k: 'gallop', near: !L.far, px: L.hind ? -29 : 148 });
    }
    if (w.wG > 0.5 && Math.floor(TAB.g[i]) > Math.floor(TAB.g[i - 1])) ev.push({ t: t + 0.1, k: 'pant' });
  }
  for (const j of JUMPS) {
    ev.push({ t: j.t + 0.3 * j.D, k: 'push' }, { t: j.t + 0.4 * j.D, k: 'whoosh' },
            { t: j.t + 0.66 * j.D, k: 'land', v: 0.4, px: 150 }, { t: j.t + 0.78 * j.D, k: 'land', v: 0.5, px: 31 });
  }
  ev.push({ t: EVT.slow1 + 0.1, k: 'huff' }, { t: EVT.lie0 + 1.1, k: 'land', v: 0.18 }, { t: EVT.lie0 + 2.3, k: 'land', v: 0.28 }, { t: EVT.lie0 + 2.5, k: 'sigh' });
  for (let t = EVT.lie1 + 1.5; t < STORY - 2.5; t += 3.6) ev.push({ t, k: 'breath' });
  return ev;
})();

// Build the whole skeleton for story time tl (body units; ground at y = 0, +y is down)
function pose(tl) {
  const W = weights(tl);
  const c = tab(TAB.w, tl), gph = tab(TAB.g, tl), gf = frac(gph), wG = W.wG;
  const U = clamp((tl - EVT.lie0) / (EVT.lie1 - EVT.lie0)), wL = smooth(U);

  let jmp = null;
  for (const j of JUMPS) { const J = (tl - j.t) / j.D; if (J > 0 && J < 1) jmp = { ...j, J }; }
  const J = jmp ? jmp.J : 0, amp = jmp ? jmp.amp : 1;
  const wJ = jmp ? keyframes(BLEND_K, J) : 0, fl = jmp ? keyframes(FLIGHT_K, J) : 0;

  // body-level pose: lift, pitch and spine flex blend between walk, gallop, rest and leap
  const gLift = keyP(G_LIFT, gf), gPitch = keyP(G_PITCH, gf), flex = wG * keyP(G_FLEX, gf);
  let lift = lerp(wG * gLift, L_LIE, wL), pitch = lerp(wG * gPitch, P_LIE, wL);
  if (jmp) { lift = lerp(lift, jumpLift(J) * amp, wJ); pitch = lerp(pitch, jumpPitch(J) * amp, wJ); }

  const bobAmt = W.wWalk * (1 - wL);
  const fBob = -2.6 * Math.cos(TAU * 2 * (c - (DUTY / 2 - 0.25))) * bobAmt;
  const hBob = -2.2 * Math.cos(TAU * 2 * (c - DUTY / 2)) * bobAmt;
  const arch = x => -9 * flex * Math.max(0, 1 - ((x + 10) / 140) ** 2);
  const off = x => lerp(hBob, fBob, clamp((x + 110) / 220)) + arch(x);

  const feet = {}, legs = {};
  for (const L of LEGS) feet[L.id] = footState(L, c);
  const bump = f => f.stance ? Math.sin(Math.PI * f.s) : 0;
  const walkAmt = bobAmt * (1 - wJ);
  const bF = (6.5 * bump(feet.LF) + 2.5 * bump(feet.RF)) * walkAmt;    // shoulder blade rolls up over the planted fore leg
  const bH = (4.0 * bump(feet.LH) + 1.5 * bump(feet.RH)) * walkAmt;    // hip rocks up over the planted hind leg
  const bAmp = 1 + 1.3 * wL;
  const breath = (Math.sin(TAU * 0.3 * tl) * (1 - wG) + Math.sin(TAU * gph) * wG) * bAmp;
  const stretch = 1 + 0.05 * fl - 0.05 * flex;       // the spine lengthens when the cat stretches out

  for (const L of LEGS) {
    const fw = feet[L.id], gp = gallopFoot(L, gph);
    const gF = toLocal(gp.x, -gp.h - 7.5, gLift, gPitch);
    const sx = L.x0 + STAND_DX[L.id];
    let Fx = fw.fx * W.wWalk + gF[0] * wG + sx * W.wStand;
    let Fy = (fw.fy - 7.5) * W.wWalk + gF[1] * wG - 7.5 * W.wStand;
    let ang = fw.ang * W.wWalk + (gp.ang - gPitch) * wG + (L.hind ? 72 : 70) * W.wStand;
    const wl = L.hind ? smooth(clamp((U - 0.25) / 0.75)) : smooth(clamp(U / 0.8));
    const lf = LIE_FEET[L.id];
    Fx = lerp(Fx, lf.x, wl); Fy = lerp(Fy, lf.y, wl); ang = lerp(ang, lf.ang, wl);
    if (jmp) { const jf = jumpFoot(L, J, jmp.sp, amp); Fx = lerp(Fx, jf.x, wJ); Fy = lerp(Fy, jf.y, wJ); ang = lerp(ang, jf.ang, wJ); }

    const F = [Fx, Fy], ext = clamp(Fx - L.x0, -75, 75), Fw = toWorld(Fx, Fy + 7.5, lift, pitch);
    if (L.hind) {
      const d = dir(ang), Hk = [F[0] - d[0] * METATARSUS, F[1] - d[1] * METATARSUS];
      const hx = HIP[0] + 0.08 * ext;                                      // pelvis rocks a little toward the paw
      const HJ = [hx * stretch, HIP[1] + off(hx) - 0.5 * bH];
      const K = ik(HJ[0], HJ[1], Hk[0], Hk[1], THIGH, SHIN, -1);
      const td = dir(ang - 66);
      legs[L.id] = { hind: true, HJ, K, Hk, F, Fw, toe: [F[0] + td[0] * 9, F[1] + td[1] * 9] };
    } else {
      const d = dir(ang), Wr = [F[0] - d[0] * 20, F[1] - d[1] * 20];
      const cx = 86 - 0.05 * ext, jx = 100 + 0.12 * ext;
      const SC = [cx * stretch, -150 + off(cx) - bF * (L.far ? 0.3 : 1)];  // top of the shoulder blade
      const SJ = [jx * stretch, -110 + off(jx)];                          // shoulder joint
      const E = ik(SJ[0], SJ[1], Wr[0], Wr[1], 48, 47, 1);
      const td = dir(ang - 72);
      legs[L.id] = { hind: false, SC, SJ, E, Wr, F, Fw, toe: [F[0] + td[0] * 9, F[1] + td[1] * 9] };
    }
  }

  const P = (x, y) => [x * stretch, y + off(x)];
  // The rump stops just behind the seat bone; below the hip the haunch is drawn by the thigh itself
  // (drawLeg), so it swings with the leg instead of hanging behind it.
  const hull = [
    P(-124, -141), P(-114, -157 - bH), P(-86, -163 - bH * 0.6), P(-42, -154), P(0, -151), P(42, -157),
    P(82, -168 - bF), P(110, -165), P(132, -158), P(148, -144),
    P(152, -118), P(140, -98), P(120, -80 - breath * 0.8), P(88, -70 - breath * 1.3),
    P(50, -74 - breath * 1.3), P(14, lerp(-86, -74, wL) - breath * 0.6), P(-20, lerp(-97, -76, wL)),
    P(-54, lerp(-104, -78, wL)), P(-86, lerp(-114, -84, wL)), P(-115, lerp(-128, -98, wL)),
  ];
  const head = {
    ear: (-16 * wG + (frac(tl / 5.9) > 0.94 ? Math.sin((frac(tl / 5.9) - 0.94) / 0.06 * TAU) * 9 : 0) * wL + 2 * Math.sin(TAU * 0.7 * tl) * (1 - wG)) * DEG,
    x: 136 * stretch,
    // head carried low, about level with the shoulder blades, so the weight reads as hanging off the shoulders
    y: -144 + 7 * (1 - wL) + off(136) + 1.4 * Math.cos(TAU * 2 * (c - DUTY / 2 + 0.1)) * bobAmt - 24 * wL,
    a: (7 + 2.5 * bobAmt + 1.6 * Math.sin(TAU * 2 * c) * walkAmt - pitch * 0.55 + wL * (2.5 * Math.sin(TAU * 0.11 * tl) - 3)) * DEG,
  };
  // tail: hangs low with the tip curling up when walking, streams out behind when running, lies along the ground at rest
  const tail = [];
  let tx = -120, ty = -146 + off(-120), N = 17;
  tail.push([tx, ty]);
  for (let i = 1; i <= N; i++) {
    const u = i / N;
    const aW = (u < 0.45 ? lerp(158, 112, u / 0.45) : lerp(112, 220, Math.pow((u - 0.45) / 0.55, 1.4)))
             + Math.sin(TAU * (c / 2) - u * 2.6) * (3 + 13 * u) + Math.sin(TAU * c - u * 2) * 3 * u;
    const aR = lerp(172, 196, u) + Math.sin(TAU * gph - u * 3) * (6 + 10 * u);
    const aL = lerp(104, 176, smooth(clamp(u * 1.5))) + Math.sin(TAU * 0.35 * tl - u * 3) * (2 + 9 * u);
    let a = lerp(lerp(aW, aR, wG), aL, wL);
    a += fl * 30 * (1 - 0.5 * u) - pitch * 0.6;
    const dd = dir(a); tx += dd[0] * 11; ty = Math.min(ty + dd[1] * 11, -3 - lift);
    tail.push([tx, ty]);
  }
  const drowsy = smooth(clamp((tl - EVT.lie1) / 9));
  const eye = (frac(tl / 4.7) > 0.968 ? 0.12 : 1) * (1 - 0.6 * drowsy);
  return { legs, hull, head, tail, off, bF, bH, feet, lift, pitch, eye, wG, wL };
}

// ---- panther drawing (into any context whose transform maps body units → screen) ----
const hh = (a, b) => { const h = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return h - Math.floor(h); };

function rn(ax, ay, bx, by) {                    // unit normal of a segment, pointing toward the rear (−x)
  const dx = bx - ax, dy = by - ay, L = Math.hypot(dx, dy) || 1;
  let nx = dy / L, ny = -dx / L;
  if (nx > 0) { nx = -nx; ny = -ny; }
  return [nx, ny];
}
function blob(c, ax, ay, bx, by, t, rx, ry, shift) {   // a muscle: ellipse laid along a bone
  const n = rn(ax, ay, bx, by), dx = bx - ax, dy = by - ay;
  c.beginPath(); c.ellipse(ax + dx * t + n[0] * shift, ay + dy * t + n[1] * shift, rx, ry, Math.atan2(dy, dx), 0, TAU); c.fill();
}
function dot(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); }

// points along a closed/open Catmull-Rom spline with outward normals (for fur on the edge)
function sampleSpline(pts, closed, per) {
  const n = pts.length, out = [], segs = closed ? n : n - 1;
  const Pp = i => pts[closed ? (i + n) % n : clamp(i, 0, n - 1)];
  for (let i = 0; i < segs; i++) {
    const p0 = Pp(i - 1), p1 = Pp(i), p2 = Pp(i + 1), p3 = Pp(i + 2);
    const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
    const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
    for (let k = 0; k < per; k++) {
      const u = k / per, v = 1 - u;
      const x = v * v * v * p1[0] + 3 * v * v * u * c1x + 3 * v * u * u * c2x + u * u * u * p2[0];
      const y = v * v * v * p1[1] + 3 * v * v * u * c1y + 3 * v * u * u * c2y + u * u * u * p2[1];
      const dx = 3 * v * v * (c1x - p1[0]) + 6 * v * u * (c2x - c1x) + 3 * u * u * (p2[0] - c2x);
      const dy = 3 * v * v * (c1y - p1[1]) + 6 * v * u * (c2y - c1y) + 3 * u * u * (p2[1] - c2y);
      const L = Math.hypot(dx, dy) || 1;
      out.push({ x, y, nx: dy / L, ny: -dx / L });
    }
  }
  return out;
}
function furEdge(c, pts, closed, per, seed, len) {   // short hairs along an outline, leaning toward the tail
  const s = sampleSpline(pts, closed, per);
  for (let i = 0; i < s.length; i++) {
    const p = s[i];
    if (hh(i, seed) < 0.12) continue;
    const L = len * (0.45 + hh(seed, i + 31));
    let dx = p.nx * 0.7 - 0.7, dy = p.ny * 0.7 + 0.2; const m = Math.hypot(dx, dy); dx /= m; dy /= m;
    const tx = -p.ny * 0.6, ty = p.nx * 0.6;
    c.beginPath(); c.moveTo(p.x - tx, p.y - ty); c.lineTo(p.x + tx, p.y + ty); c.lineTo(p.x + dx * L, p.y + dy * L); c.fill();
  }
}
function furSeg(c, ax, ay, ar, bx, by, br, seed) {   // the same, along both sides of a limb segment
  const dx = bx - ax, dy = by - ay, L = Math.hypot(dx, dy) || 1, tx = dx / L, ty = dy / L, nx = ty, ny = -tx;
  const n = Math.max(2, Math.round(L / 4));
  for (let i = 0; i <= n; i++) for (const sd of [-1, 1]) {
    if (hh(i + seed, sd * 7.7) < 0.2) continue;
    const u = i / n, r = lerp(ar, br, u), len = 1.2 + 2.4 * hh(sd + seed, i * 3.1);
    const x0 = ax + dx * u + nx * sd * r * 0.95, y0 = ay + dy * u + ny * sd * r * 0.95;
    let sx = nx * sd * 0.8 + tx * 0.5, sy = ny * sd * 0.8 + ty * 0.5; const m = Math.hypot(sx, sy); sx /= m; sy /= m;
    c.beginPath(); c.moveTo(x0 - tx * 0.6, y0 - ty * 0.6); c.lineTo(x0 + tx * 0.6, y0 + ty * 0.6); c.lineTo(x0 + sx * len, y0 + sy * len); c.fill();
  }
}

// ---- head (local coords: origin at the back of the skull, facing right) ----
const HS = 1.16;   // head scale
const HEAD_PTS = [[-4, -6], [1, -20], [12, -31], [28, -36], [44, -33], [56, -26], [66, -17], [74, -11], [80, -8], [83, -3],
                  [81, 3], [77, 7], [74, 11], [69, 16], [62, 20], [50, 25], [36, 29], [22, 31], [8, 28], [-2, 19]];
function earPath(c, ear, dx, dy, k) {
  c.save(); c.translate(19 + dx, -30 + dy); c.rotate(ear); c.translate(-19, 30); c.scale(k, k);
  c.beginPath(); c.moveTo(6, -24); c.quadraticCurveTo(6, -44, 17, -48); c.quadraticCurveTo(29, -46, 33, -30); c.closePath(); c.fill();
  c.restore();
}
function drawHead(c, H) {
  c.save(); c.translate(H.x, H.y); c.rotate(H.a); c.scale(HS, HS);
  earPath(c, (H.ear || 0) * 0.8, 9, -3, 0.92);                 // far ear, partly hidden
  c.beginPath(); splinePath(c, HEAD_PTS); c.fill();
  earPath(c, H.ear || 0, 0, 0, 1);                             // near ear
  furEdge(c, HEAD_PTS, true, 4, 9, 1.8);
  c.restore();
}

// ---- limbs: bones plus muscle, so the outline swells and tapers like a real cat ----
function drawPaw(c, F, toe) {
  const d = Math.hypot(toe[0] - F[0], toe[1] - F[1]) || 1, ux = (toe[0] - F[0]) / d, uy = (toe[1] - F[1]) / d;
  capsule(c, F[0], F[1], 9, toe[0], toe[1], 7.6);
  dot(c, toe[0] + ux * 3, toe[1] + uy * 3, 4.4);
}
// The haunch: a muscle mass hung between the pelvis (fixed to the body) and the knee (moves with the leg).
// Swing the leg forward and it tucks up under the croup; push it back and the hamstrings follow it.
function thighOutline(L, far) {
  const k = far ? 0.82 : 1, H = [L.HJ[0], L.HJ[1] + (far ? 8 : 0)], K = L.K;
  const dx = K[0] - H[0], dy = K[1] - H[1], d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d;
  const fx = uy, fy = -ux;                                      // normal toward the front of the thigh
  const at = (p, a, b) => [p[0] + ux * a + fx * b, p[1] + uy * a + fy * b];
  const seat = [H[0] - 29 * k, H[1] + 5 * k];                  // seat bone: back corner of the haunch
  const kneePit = at(K, -3, -16 * k);
  const ham = 0.45, bulge = far ? 5 : 11;                                             // where along the back of the thigh the hamstrings bulge most
  return [
    [H[0] - 21 * k, H[1] - 25 * k],                             // top of the haunch, under the croup
    at(H, 20, 25 * k),                                          // quadriceps
    at(K, -6, 13 * k),                                          // front of the stifle
    at(K, 8, 1),                                                // knee cap
    kneePit,
    [lerp(seat[0], kneePit[0], ham) - fx * bulge, lerp(seat[1], kneePit[1], ham) - fy * bulge],     // hamstrings
    seat,
  ];
}
function drawLeg(c, L, far = false) {
  if (L.hind) {
    const th = thighOutline(L, far);
    c.beginPath(); splinePath(c, th); c.fill();
    capsule(c, L.K[0], L.K[1], 15, L.Hk[0], L.Hk[1], 8.4);
    blob(c, L.K[0], L.K[1], L.Hk[0], L.Hk[1], 0.32, 24, 11.5, 6);                    // calf
    capsule(c, L.Hk[0], L.Hk[1], 8.4, L.F[0], L.F[1], 6.8);
    const n = rn(L.K[0], L.K[1], L.Hk[0], L.Hk[1]); dot(c, L.Hk[0] + n[0] * 3, L.Hk[1] + n[1] * 3, 7.6);   // hock
    drawPaw(c, L.F, L.toe);
    furEdge(c, th, true, 5, far ? 17 : 11, 2.2);
    furSeg(c, L.K[0], L.K[1], 15, L.Hk[0], L.Hk[1], 8.4, 12);
    furSeg(c, L.Hk[0], L.Hk[1], 8.4, L.F[0], L.F[1], 6.8, 13);
  } else {
    if (!far) { capsule(c, L.SC[0], L.SC[1], 22, L.SJ[0], L.SJ[1], 24); blob(c, L.SC[0], L.SC[1], L.SJ[0], L.SJ[1], 0.5, 30, 22, 2); }   // shoulder blade
    capsule(c, L.SJ[0], L.SJ[1], 22, L.E[0], L.E[1], 14.5);
    const n1 = rn(L.SJ[0], L.SJ[1], L.E[0], L.E[1]); dot(c, L.E[0] + n1[0] * 3, L.E[1] + n1[1] * 3, 13);       // elbow
    capsule(c, L.E[0], L.E[1], 14, L.Wr[0], L.Wr[1], 9.4);
    blob(c, L.E[0], L.E[1], L.Wr[0], L.Wr[1], 0.28, 25, 12, 2);                                                 // forearm
    capsule(c, L.Wr[0], L.Wr[1], 9.4, L.F[0], L.F[1], 8.6);
    const n2 = rn(L.E[0], L.E[1], L.Wr[0], L.Wr[1]); dot(c, L.Wr[0] + n2[0] * 3, L.Wr[1] + n2[1] * 3, 8.4);    // wrist
    drawPaw(c, L.F, L.toe);
    furSeg(c, L.SJ[0], L.SJ[1], 22, L.E[0], L.E[1], 14.5, 21);
    furSeg(c, L.E[0], L.E[1], 14, L.Wr[0], L.Wr[1], 9.4, 22);
    furSeg(c, L.Wr[0], L.Wr[1], 9.4, L.F[0], L.F[1], 8.6, 23);
  }
}
function drawTail(c, tail) {
  const n = tail.length - 1;
  for (let i = 0; i < n; i++) {
    const r0 = lerp(10.5, 6.6, Math.pow(i / n, 0.8)), r1 = lerp(10.5, 6.6, Math.pow((i + 1) / n, 0.8));
    capsule(c, tail[i][0], tail[i][1], r0, tail[i + 1][0], tail[i + 1][1], r1);
    furSeg(c, tail[i][0], tail[i][1], r0, tail[i + 1][0], tail[i + 1][1], r1, 40 + i);
  }
}
function drawBody(c, P) {
  drawTail(c, P.tail);
  c.beginPath(); splinePath(c, P.hull); c.fill();
  c.beginPath(); c.ellipse(P.head.x - 16, P.head.y + 12, 34, 32, 0.3, 0, TAU); c.fill();     // neck
  furEdge(c, P.hull, true, 6, 3, 2.6);
  drawLeg(c, P.legs.LH);
  drawLeg(c, P.legs.LF);
  drawHead(c, P.head);
}

// Faint "ghost rosettes" — black panthers are spotted leopards; in moonlight the pattern just shows.
const ROSETTES = (() => {
  const r = rng(7), out = [];
  for (let x = -122; x < 128; x += 19) for (let y = -156; y < -88; y += 17) {
    const jx = x + (r() - 0.5) * 12, jy = y + (r() - 0.5) * 10;
    out.push({ x: jx, y: jy, r: 3.5 + r() * 2.8, rot: r() * TAU, gaps: 3 + Math.floor(r() * 3) });
  }
  return out;
})();

// ---- scene layout ------------------------------------------------------------
let W, H, S, sc, ox, oy, DPR;
let mBody, cBody, mRim, cRim, mFar, cFar;
let layers = {};
function makeCanvas() { const c = document.createElement('canvas'); c.width = W; c.height = H; return [c, c.getContext('2d')]; }

function resize() {
  DPR = window.devicePixelRatio || 1;
  W = canvas.width = Math.round(innerWidth * DPR);
  H = canvas.height = Math.round(innerHeight * DPR);
  S = Math.min(W, H);
  const portrait = H > W;
  sc = Math.min(W * 0.86 / 560, H * (portrait ? 0.4 : 0.44) / 260);
  ox = W / 2 + 40 * sc;
  oy = H * (portrait ? 0.68 : 0.8);
  [mBody, cBody] = makeCanvas(); [mRim, cRim] = makeCanvas(); [mFar, cFar] = makeCanvas();
  buildLayers();
}

function buildLayers() {
  const r = rng(42);
  const span = f => V * sc * f * LOOP;     // each layer repeats exactly once per loop
  // far forest: slender trunks + canopy clumps, hazy blue
  const far = { f: 0.22, L: span(0.22), items: [] };
  for (let x = 0; x < far.L; x += (40 + r() * 70) * sc) far.items.push({ x, w: (4 + r() * 10) * sc, lean: (r() - 0.5) * 0.06, top: r() * 0.25, clumps: Array.from({ length: 3 + Math.floor(r() * 4) }, () => [(r() - 0.5) * 120 * sc, r() * 0.35 * H, (25 + r() * 55) * sc]) });
  // mid jungle: big trunks with roots, hanging vines, fern clusters
  const mid = { f: 0.55, L: span(0.55), items: [] };
  for (let x = 0; x < mid.L; x += (180 + r() * 260) * sc) mid.items.push({ x, kind: r() < 0.55 ? 'trunk' : 'fern', w: (26 + r() * 40) * sc, s: 0.8 + r() * 0.7, seed: Math.floor(r() * 1e6), vines: Math.floor(r() * 3) });
  // ground: grass tufts and leaf litter, moves exactly with the paws
  const gr = { f: 1, L: span(1), items: [] };
  for (let x = 0; x < gr.L; x += (14 + r() * 40) * sc) gr.items.push({ x, h: (6 + r() * 18) * sc, n: 3 + Math.floor(r() * 5), front: r() < 0.22, seed: Math.floor(r() * 1e6) });
  // foreground: big dark leaves that drift past in front, near the bottom
  const fg = { f: 1.7, L: span(1.7), items: [] };
  for (let x = 0; x < fg.L; x += (700 + r() * 900) * sc) fg.items.push({ x, s: 1 + r() * 0.8, seed: Math.floor(r() * 1e6) });
  // fireflies
  const ff = { f: 0.4, L: span(0.4), items: [] };
  for (let i = 0; i < 22; i++) ff.items.push({ x: r() * ff.L, y: oy - (15 + r() * 230) * sc, ph: r() * TAU, k: 2 + Math.floor(r() * 4), dr: (10 + r() * 25) * sc });
  // stars
  const stars = Array.from({ length: 90 }, () => ({ x: r() * W, y: r() * oy * 0.55, a: 0.2 + r() * 0.6, k: 1 + Math.floor(r() * 6), ph: r() * TAU, s: (0.6 + r() * 1.2) * DPR }));
  layers = { far, mid, gr, fg, ff, stars };
}

function eachWrapped(layer, t, margin, fn) {
  const offset = (SD * sc * layer.f) % layer.L;
  for (const it of layer.items) for (let k = -1; k <= 1; k++) {
    const x = it.x - offset + k * layer.L;
    if (x > -margin && x < W + margin) fn(it, x);
  }
}

// ---- background --------------------------------------------------------------
const MOON = () => [W * 0.24, H * (H > W ? 0.14 : 0.2), S * 0.055];

function drawSky(t) {
  const g = ctx.createLinearGradient(0, 0, 0, oy);
  g.addColorStop(0, '#05070f'); g.addColorStop(0.55, '#0b1222'); g.addColorStop(1, '#141d33');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const s of layers.stars) {
    const a = s.a * (0.6 + 0.4 * Math.sin(t * W0 * s.k * 3 + s.ph));
    ctx.fillStyle = `rgba(210,222,255,${a})`; ctx.fillRect(s.x, s.y, s.s, s.s);
  }
  const [mx, my, mr] = MOON();
  const halo = ctx.createRadialGradient(mx, my, mr * 0.8, mx, my, mr * 7);
  halo.addColorStop(0, 'rgba(170,195,255,0.28)'); halo.addColorStop(0.3, 'rgba(120,150,230,0.08)'); halo.addColorStop(1, 'rgba(80,110,200,0)');
  ctx.fillStyle = halo; ctx.fillRect(0, 0, W, H);
  const disc = ctx.createRadialGradient(mx - mr * 0.3, my - mr * 0.3, mr * 0.1, mx, my, mr);
  disc.addColorStop(0, '#f4f7ff'); disc.addColorStop(1, '#c7d4f2');
  ctx.fillStyle = disc; ctx.beginPath(); ctx.arc(mx, my, mr, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(150,165,200,0.25)';                       // maria
  for (const [dx, dy, rr] of [[-0.3, -0.1, 0.28], [0.2, 0.25, 0.22], [0.25, -0.3, 0.15], [-0.1, 0.35, 0.12]]) {
    ctx.beginPath(); ctx.arc(mx + dx * mr, my + dy * mr, rr * mr, 0, TAU); ctx.fill();
  }
}

function drawFar(t) {
  const L = layers.far;
  eachWrapped(L, t, 200 * sc, (it, x) => {
    ctx.fillStyle = '#111a2e';
    ctx.beginPath();
    const base = oy - 18 * sc, top = H * it.top - 20;
    ctx.moveTo(x - it.w / 2, base); ctx.lineTo(x - it.w * 0.35 + it.lean * (base - top), top);
    ctx.lineTo(x + it.w * 0.35 + it.lean * (base - top), top); ctx.lineTo(x + it.w / 2, base); ctx.fill();
    ctx.fillStyle = '#0f182b';
    for (const [dx, y, rr] of it.clumps) { ctx.beginPath(); ctx.ellipse(x + dx, y, rr * 1.4, rr, 0, 0, TAU); ctx.fill(); }
  });
  // haze over the far layer
  const g = ctx.createLinearGradient(0, oy - 260 * sc, 0, oy);
  g.addColorStop(0, 'rgba(40,58,95,0)'); g.addColorStop(1, 'rgba(48,66,105,0.45)');
  ctx.fillStyle = g; ctx.fillRect(0, oy - 260 * sc, W, 260 * sc);
}

function leafShape(c, x, y, len, ang, wid) {
  const ca = Math.cos(ang), sa = Math.sin(ang);
  const tx = x + ca * len, ty = y + sa * len, nx = -sa * wid, ny = ca * wid;
  c.beginPath(); c.moveTo(x, y);
  c.quadraticCurveTo(x + ca * len * 0.5 + nx, y + sa * len * 0.5 + ny, tx, ty);
  c.quadraticCurveTo(x + ca * len * 0.5 - nx, y + sa * len * 0.5 - ny, x, y);
  c.fill();
}
function fern(c, x, y, s, seed, color) {

    const a = a0 * DEG + sw * 0.5; ctx.beginPath(); ctx.moveTo(60, -22); ctx.lineTo(60 + Math.cos(a) * len, -22 + Math.sin(a) * len); ctx.stroke();
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

// ---- foreground & atmosphere ---------------------------------------------------
function drawForeground(t) {
  eachWrapped(layers.fg, t, 500 * sc, (it, x) => {
    const r = rng(it.seed); ctx.fillStyle = '#020306';
    const y = H + 20 * sc;
    for (let i = 0; i < 7; i++) {
      const a = (-100 + (r() - 0.5) * 80) * DEG, len = (45 + r() * 60) * it.s * sc;
      leafShape(ctx, x + (r() - 0.5) * 90 * sc, y, len, a, len * 0.18);
    }
  });
}
function drawFireflies(t) {
  ctx.globalCompositeOperation = 'lighter';
  eachWrapped(layers.ff, t, 30 * sc, (it, x) => {
    const blink = Math.pow(Math.max(0, Math.sin(t * W0 * it.k * 4 + it.ph)), 4);
    if (blink < 0.02) return;
    const fx = x + Math.sin(t * W0 * it.k + it.ph) * it.dr, fy = it.y + Math.cos(t * W0 * (it.k + 1) + it.ph) * it.dr * 0.6;
    const rr = 9 * sc;
    const g = ctx.createRadialGradient(fx, fy, 0, fx, fy, rr);
    g.addColorStop(0, `rgba(220,255,140,${0.9 * blink})`); g.addColorStop(0.25, `rgba(170,230,90,${0.35 * blink})`); g.addColorStop(1, 'rgba(120,200,60,0)');
    ctx.fillStyle = g; ctx.fillRect(fx - rr, fy - rr, rr * 2, rr * 2);
  });
  ctx.globalCompositeOperation = 'source-over';
}
function drawMist(t, y, h, a) {
  const g = ctx.createLinearGradient(0, y - h / 2, 0, y + h / 2);
  const al = a * (0.8 + 0.2 * Math.sin(t * W0 * 2));
  g.addColorStop(0, 'rgba(120,145,205,0)'); g.addColorStop(0.5, `rgba(120,145,205,${al})`); g.addColorStop(1, 'rgba(120,145,205,0)');
  ctx.fillStyle = g; ctx.fillRect(0, y - h / 2, W, h);
}
function drawRays() {
  const [mx, my] = MOON();
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const [a, w, al] of [[52, 0.09, 0.022], [63, 0.07, 0.018]]) {
    const ang = a * DEG, len = Math.hypot(W, H) * 1.2;
    const ex = mx + Math.cos(ang) * len, ey = my + Math.sin(ang) * len;
    const g = ctx.createLinearGradient(mx, my, ex, ey);
    g.addColorStop(0, `rgba(170,195,255,${al})`); g.addColorStop(1, 'rgba(170,195,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(mx, my);
    ctx.lineTo(mx + Math.cos(ang - w) * len, my + Math.sin(ang - w) * len);
    ctx.lineTo(mx + Math.cos(ang + w) * len, my + Math.sin(ang + w) * len); ctx.fill();
  }
  ctx.restore();
}
function vignette() {
  const g = ctx.createRadialGradient(W / 2, H * 0.55, S * 0.35, W / 2, H * 0.55, Math.max(W, H) * 0.75);
  g.addColorStop(0, 'rgba(2,3,8,0)'); g.addColorStop(1, 'rgba(2,3,8,0.7)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// ---- main loop -----------------------------------------------------------------
let startTime = performance.now();
function frame(now) {
  const t = Math.max(0, (now - startTime) / 1000) + T0;
  STL = t % STORY; SD = tab(TAB.d, STL);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.filter = 'none'; ctx.globalCompositeOperation = 'source-over';
  drawSky(t);
  drawRays();
  drawFar(t);
  drawMist(t, oy - 70 * sc, 140 * sc, 0.12);
  drawMid(t);
  drawGround(t);
  drawLog(t);
  tufts(t, false);
  drawDust();
  drawPanther(t);
  tufts(t, true);
  drawMist(t, oy + 4 * sc, 40 * sc, 0.1);
  drawFireflies(t);
  drawForeground(t);
  vignette();
  const fade = STL < FIN ? 1 - STL / FIN : STL > SEND - FOUT ? Math.min(1, (STL - (SEND - FOUT)) / FOUT) : 0;
  if (fade > 0) { ctx.fillStyle = `rgba(3,5,10,${smooth(fade)})`; ctx.fillRect(0, 0, W, H); }
  requestAnimationFrame(frame);
}
window.addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);

// ---- sound: night pad, crickets, breeze, soft paw steps -------------------------
let ac, master, wet, noiseBuf, audioOn = false, schedUntil = 0;
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function makeReverb() {
  const len = ac.sampleRate * 4, buf = ac.createBuffer(2, len, ac.sampleRate);
  for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
  const cv = ac.createConvolver(); cv.buffer = buf; return cv;
}
function noise(at, dur, type, freq, q, vol, pan = 0, toWet = 0.3) {
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(), p = ac.createStereoPanner();
  s.buffer = noiseBuf; f.type = type; f.frequency.value = freq; f.Q.value = q; p.pan.value = pan;
  g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol, at + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  s.connect(f); f.connect(g); g.connect(p); p.connect(master);
  if (toWet) { const w = ac.createGain(); w.gain.value = toWet; p.connect(w); w.connect(wet); }
  s.start(at, Math.random() * 1.5); s.stop(at + dur + 0.05);
}
function breathSnd(at, dur, vol, freq = 700) {      // slow-swelling breath
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(), w = ac.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = freq; f.Q.value = 0.6;
  g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol, at + dur * 0.4); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  w.gain.value = 0.4; s.connect(f); f.connect(g); g.connect(master); g.connect(w); w.connect(wet);
  s.start(at, Math.random() * 1.5); s.stop(at + dur + 0.05);
}
function playEvent(e, a) {
  switch (e.k) {
    case 'walk': pawStep(a, e.near); break;
    case 'gallop': noise(a, 0.2, 'lowpass', 150, 0.8, e.near ? 0.5 : 0.34, 0, 0.2); noise(a + 0.01, 0.08, 'bandpass', 2600, 1.2, 0.045, 0.1, 0.2); break;
    case 'push': noise(a, 0.22, 'lowpass', 140, 0.8, 0.55, 0, 0.15); noise(a + 0.02, 0.1, 'bandpass', 2400, 1.1, 0.05, 0.1, 0.2); break;
    case 'whoosh': noise(a, 0.6, 'bandpass', 900, 0.5, 0.06, 0.2, 0.5); break;
    case 'land': noise(a, 0.24, 'lowpass', 160, 0.8, e.v, 0, 0.2); noise(a + 0.01, 0.1, 'bandpass', 2300, 1.2, 0.04, 0, 0.2); break;
    case 'pant': breathSnd(a, 0.22, 0.035, 1600); break;
    case 'huff': breathSnd(a, 0.9, 0.07, 1100); break;
    case 'sigh': breathSnd(a, 2.2, 0.06, 600); break;
    case 'breath': breathSnd(a, 1.5, 0.028, 700); break;
  }
}
function pawStep(at, near) {
  noise(at, 0.16, 'lowpass', 180, 0.8, near ? 0.32 : 0.2, 0, 0.15);   // soft pad thud
  noise(at + 0.01, 0.07, 'bandpass', 2600, 1.2, near ? 0.025 : 0.015, 0.1, 0.2);   // leaf crunch
}
function chirp(at, freq, pan, vol) {
  for (let i = 0; i < 3; i++) {
    const o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner();
    o.frequency.value = freq; p.pan.value = pan;
    const t0 = at + i * 0.045;
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.03);
    o.connect(g); g.connect(p); p.connect(master); p.connect(wet);
    o.start(t0); o.stop(t0 + 0.04);
  }
}
function owl(at) {
  [0, 0.55, 0.8].forEach((d, i) => {
    const o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner();
    o.type = 'sine'; o.frequency.setValueAtTime(390, at + d); o.frequency.linearRampToValueAtTime(360, at + d + 0.35);
    p.pan.value = -0.6;
    g.gain.setValueAtTime(0.0001, at + d); g.gain.exponentialRampToValueAtTime(i ? 0.03 : 0.04, at + d + 0.06); g.gain.exponentialRampToValueAtTime(0.0001, at + d + (i ? 0.25 : 0.4));
    o.connect(g); g.connect(p); p.connect(wet); p.connect(master);
    o.start(at + d); o.stop(at + d + 0.5);
  });
}
function pad(at, notes, len) {
  notes.forEach(n => [-6, 6].forEach(det => {
    const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
    o.type = 'triangle'; o.frequency.value = mtof(n); o.detune.value = det;
    f.type = 'lowpass'; f.frequency.value = 900;
    g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(0.018, at + 3); g.gain.linearRampToValueAtTime(0, at + len);
    o.connect(f); f.connect(g); g.connect(master); g.connect(wet);
    o.start(at); o.stop(at + len + 0.1);
  }));
}
const CHORDS = [[45, 52, 57, 59, 64], [41, 48, 55, 57, 64], [43, 50, 55, 59, 62], [40, 47, 52, 55, 59]];
function startBreeze() {
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(), lfo = ac.createOscillator(), lg = ac.createGain();
  s.buffer = noiseBuf; s.loop = true; f.type = 'bandpass'; f.frequency.value = 450; f.Q.value = 0.6;
  g.gain.value = 0.03; lfo.frequency.value = 0.08; lg.gain.value = 0.02;
  lfo.connect(lg); lg.connect(g.gain); s.connect(f); f.connect(g); g.connect(master); g.connect(wet);
  s.start(); lfo.start();
}
// schedule everything a little ahead, timed exactly to the animation clock
function schedule() {
  if (!audioOn) return;
  const tNow = (performance.now() - startTime) / 1000;
  const until = tNow + 0.35;
  const at = te => ac.currentTime + (te - tNow);
  const between = (period, phase, fn) => {
    for (let k = Math.ceil((schedUntil - phase) / period); k * period + phase < until; k++) {
      const te = k * period + phase; if (te >= schedUntil && te >= tNow - 0.01) fn(te);
    }
  };
  // gait, leaps and rest sounds come from the story's event list, timed exactly to the animation
  const k0 = Math.max(0, Math.floor(schedUntil / STORY)), k1 = Math.floor(until / STORY);
  for (let k = k0; k <= k1; k++) for (const e of EVENTS) {
    const te = k * STORY + e.t;
    if (te >= schedUntil && te < until && te >= tNow - 0.01) playEvent(e, at(te));
  }
  between(9, 0, te => pad(at(te), CHORDS[Math.round(te / 9) % 4], 12));
  between(0.83, 0.2, te => chirp(at(te), 4700, -0.5, 0.012));
  between(1.07, 0.5, te => chirp(at(te), 5200, 0.55, 0.009));
  between(18, 7, te => owl(at(te)));
  schedUntil = until;
}
const overlay = document.getElementById('overlay');
function begin() {
  if (audioOn) return;
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ac.createDynamicsCompressor(); comp.connect(ac.destination);
    master = ac.createGain(); master.gain.setValueAtTime(0, ac.currentTime); master.gain.linearRampToValueAtTime(0.9, ac.currentTime + 2.5); master.connect(comp);
    wet = ac.createGain(); wet.gain.value = 0.5; const rv = makeReverb(); wet.connect(rv); rv.connect(master);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    startBreeze();
    startTime = performance.now(); schedUntil = 0; audioOn = true;
    setInterval(schedule, 60); schedule();
  } catch (e) {}
  overlay.classList.add('hidden');
}
overlay.addEventListener('click', begin);
overlay.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); begin(); } });
</script>
