<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, initial-scale=1.0" />
    <title>PANTHERA ep30 in HyperFrames</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #070a12;
      }
      #main {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      /* The episode draws itself into this canvas (episode.js, from the built episode page). */
      #c {
        display: block;
        width: 1080px;
        height: 1920px;
      }
      #overlay {
        display: none;
      }
      /* HyperFrames-native test layer: a DOM element animated by GSAP over the canvas. */
      #tag {
        position: absolute;
        top: 170px;
        right: 0;
        padding: 18px 44px 18px 36px;
        background: #0b0b10;
        border-left: 10px solid #9b7bff;
        color: #ffd84a;
        font: italic 900 44px/1 "Segoe UI", system-ui, sans-serif;
        letter-spacing: 1px;
        transform: skewX(-8deg);
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="main"
      data-composition-id="main"
      data-width="1080"
      data-height="1920"
      data-start="0"
      data-duration="28"
    >
      <div class="clip" data-start="0" data-duration="28" data-track-index="0" style="z-index: 0">
        <canvas id="c"></canvas>
      </div>

      <div class="clip" data-start="0" data-duration="28" data-track-index="1" style="z-index: 1">
        <div id="tag">@HappyHillz</div>
      </div>

      <audio
        id="score"
        src="assets/ep30-score.wav"
        data-start="0"
        data-duration="28"
        data-track-index="2"
        data-volume="1"
      ></audio>

      <div id="overlay"></div>
      <script src="episode.js"></script>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#tag", { xPercent: 110, opacity: 0 }, { xPercent: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 4);
        tl.to("#tag", { xPercent: 110, opacity: 0, duration: 0.35, ease: "power2.in" }, 8.6);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      </script>
    </div>
  </body>
</html>
