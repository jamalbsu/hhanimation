//  Panther Run — a pack of five black panthers gallops joyfully toward somewhere
//  they love. They glance at each other, and one after another a different
//  panther surges ahead, then they all rejoin and run into the light.
//  Five versions (?v=1..5) share one rig and differ in place, mood, music and who leads.
//
//  Camera: a raised camera, so the ground recedes up the screen. This is 2.5D,
//  not 3D: every panther is the same flat side-view drawing standing in its own
//  lane; lanes further back sit higher on screen and a little smaller.
//  Rig (from Moonlit Panther): 2D skeleton, 2-bone IK per leg, gallop gait.
//  Everything is a pure function of time, so a frame can be drawn at any t —
//  that is how the videos are rendered (see ?capture and window.cap / renderAudioWav).
// ============================================================================
const canvas = document.getElementById('c');

const TAU = Math.PI * 2;

// ---- helpers
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = x => x * x * (3 - 2 * x);
const frac = x => x - Math.floor(x);
const dir = a => [Math.cos(a * DEG), Math.sin(a * DEG)];
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function keyframes(k, s) {                  // k = [[s0,v0],[s1,v1],...], smooth between keys
  for (let i = 0; i < k.length - 1; i++) if (s <= k[i + 1][0]) {
    const u = (s - k[i][0]) / (k[i + 1][0] - k[i][0]);
    return lerp(k[i][1], k[i + 1][1], smooth(clamp(u)));
  }
  return k[k.length - 1][1];
}
function splinePath(c, pts, closed = true) {   // Catmull-Rom through points
  const n = pts.length, P = i => pts[closed ? (i + n) % n : clamp(i, 0, n - 1)];
  c.moveTo(pts[0][0], pts[0][1]);
  for (let i = 0; i < (closed ? n : n - 1); i++) {
    const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
    c.bezierCurveTo(p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6,
                    p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6, p2[0], p2[1]);
  }
  if (closed) c.closePath();
}
function capsule(c, ax, ay, ar, bx, by, br) {     // tapered limb segment
  const dx = bx - ax, dy = by - ay, d = Math.hypot(dx, dy) || 1e-3, a = Math.atan2(dy, dx);
  const s = Math.asin(clamp((ar - br) / d, -1, 1));
  c.beginPath();
  c.arc(ax, ay, ar, a + Math.PI / 2 - s, a + Math.PI * 1.5 + s);
  c.arc(bx, by, br, a - Math.PI / 2 + s, a + Math.PI / 2 - s);
  c.closePath(); c.fill();
}
function ik(ax, ay, bx, by, l1, l2, bend) {       // 2-bone IK → middle joint
  const dx = bx - ax, dy = by - ay, d = Math.hypot(dx, dy), base = Math.atan2(dy, dx);
  if (d >= l1 + l2 - 0.01) { const r = l1 / (l1 + l2); return [ax + dx * r, ay + dy * r]; }
  const a = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));
  return [ax + l1 * Math.cos(base + bend * a), ay + l1 * Math.sin(base + bend * a)];
}
function cr(p0, p1, p2, p3, u) {              // Catmull-Rom on numbers
  const u2 = u * u, u3 = u2 * u;
  return 0.5 * (2 * p1 + (p2 - p0) * u + (2 * p0 - 5 * p1 + 4 * p2 - p3) * u2 + (3 * p1 - p0 - 3 * p2 + p3) * u3);
}
function keyCR(k, s) {                         // smooth curve through [time, value] keys
  if (s <= k[0][0]) return k[0][1];
  if (s >= k[k.length - 1][0]) return k[k.length - 1][1];
  let i = 0; while (s > k[i + 1][0]) i++;
  const u = (s - k[i][0]) / (k[i + 1][0] - k[i][0]);
  const v = j => k[clamp(j, 0, k.length - 1)][1];
  return cr(v(i - 1), v(i), v(i + 1), v(i + 2), u);
}
function keyP(k, s) {                          // same, repeating; first and last key hold the same value
  s = frac(s); const n = k.length - 1;
  let i = 0; while (i < n - 1 && s > k[i + 1][0]) i++;
  const u = (s - k[i][0]) / (k[i + 1][0] - k[i][0]);
  const v = j => k[((j % n) + n) % n][1];
  return cr(v(i - 1), v(i), v(i + 1), v(i + 2), u);
}
function toLocal(xw, yw, L, Pd) {              // ground coords → panther body coords (lift L, pitch Pd°)
  const a = -Pd * DEG, x = xw, y = yw - L + 120;
  return [x * Math.cos(a) - y * Math.sin(a), x * Math.sin(a) + y * Math.cos(a) - 120];
}
function toWorld(x, y, L, Pd) {
  const a = Pd * DEG, Y = y + 120;
  return [x * Math.cos(a) - Y * Math.sin(a), x * Math.sin(a) + Y * Math.cos(a) - 120 + L];
}

const mixAny = (a, b, u) => Array.isArray(a) ? a.map((v, i) => mixAny(v, b[i], u)) : lerp(a, b, u);

const params = new URLSearchParams(location.search);

// ---- the day cycle (versions 6–10): bright day → dusk → night → dawn → bright day ----------------
// One lap of the sun and moon across the video. The palette is built from a daytime palette plus
// generic dusk / night / dawn grades, and blended along the clock.
const CYC = !!CFG.cyc;
const altAt = t => Math.cos(TAU * t / DUR);                      // +1 noon … 0 sunrise / sunset … −1 midnight
const dayAmt = t => smooth(clamp((altAt(t) + 0.1) / 0.5));
const nightAmt = t => smooth(clamp((-altAt(t) - 0.05) / 0.5));

// head (local coords: origin at the back of the skull, facing right). Looking back turns it right round:

const HS = 1.16;

// limbs: bones plus muscle, so the outline swells and tapers like a real cat (LIMB and TW scale them per animal)
function drawPaw(c, F, toe, q = 1) {
  const d = Math.hypot(toe[0] - F[0], toe[1] - F[1]) || 1, ux = (toe[0] - F[0]) / d, uy = (toe[1] - F[1]) / d;

// The haunch: a muscle mass hung between the pelvis (fixed to the body) and the knee (moves with the leg).
function thighOutline(L, far) {

    blob(c, L.K[0], L.K[1], L.Hk[0], L.Hk[1], 0.32, 24 * q, 11.5 * q, 6 * q);                                  // calf
    capsule(c, L.Hk[0], L.Hk[1], 8.4 * q, L.F[0], L.F[1], 6.8 * q);
    const n = rn(L.K[0], L.K[1], L.Hk[0], L.Hk[1]); dot(c, L.Hk[0] + n[0] * 3 * q, L.Hk[1] + n[1] * 3 * q, 7.6 * q);   // hock

    capsule(c, L.Wr[0], L.Wr[1], 9.4 * q, L.F[0], L.F[1], 8.6 * q);
    const n2 = rn(L.E[0], L.E[1], L.Wr[0], L.Wr[1]); dot(c, L.Wr[0] + n2[0] * 3 * q, L.Wr[1] + n2[1] * 3 * q, 8.4 * q);   // wrist

}
function drawTail(c, tail) {

function drawBody(c, P) {

    c.beginPath(); c.ellipse(P.head.x - 16, P.head.y + 12, 34, 32, 0.3, 0, TAU); c.fill();     // neck
    const s = smooth(P.head.turn);
    if (s > 0.05) { c.beginPath(); c.ellipse(P.head.x - 20, P.head.y - 12, 28 * Math.min(1, s * 2), 17 * Math.min(1, s * 2), -0.7, 0, TAU); c.fill(); }   // neck arching round
  } else if (P.kind === 'horse') {

  }

// heads for the horse and the bear (the cats keep their own, drawn by drawHeadCat)
const HEAD_HORSE = [[-6, -12], [6, -28], [26, -38], [54, -40], [84, -34], [104, -22], [118, -10], [122, 2], [116, 12], [100, 18], [76, 20], [52, 26], [30, 28], [10, 22], [-6, 10]];

function drawHead(c, H) {
  if (H.kind !== 'horse' && H.kind !== 'bear') return drawHeadCat(c, H);
  c.save(); headFrame(c, H);
  if (H.kind === 'horse') {                                                                            // pointed ears
    c.beginPath(); c.moveTo(10, -26); c.lineTo(16, -54); c.lineTo(30, -34); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(34, -32); c.lineTo(42, -52); c.lineTo(50, -34); c.closePath(); c.fill();
  } else {                                                                                             // round ears
    c.beginPath(); c.arc(16, -40, 11, 0, TAU); c.fill(); c.beginPath(); c.arc(50, -48, 9, 0, TAU); c.fill();
  }

  c.restore();
}
function drawFace(c, P, k) { if (P.kind === 'horse' || P.kind === 'bear') drawFaceSp(c, P, k); else drawFaceCat(c, P, k); }
function drawFaceSp(c, P, k) {

  c.fillStyle = 'rgba(236,226,200,0.55)'; c.beginPath(); c.ellipse(e[0], e[1], 6.4, 4.4, -0.1, 0, TAU); c.fill();
  c.fillStyle = RGB(col); c.beginPath(); c.ellipse(e[0] + 0.5, e[1], 4.4, 3.8, 0, 0, TAU); c.fill();
  c.fillStyle = '#060606'; c.beginPath(); c.ellipse(e[0] + 0.6, e[1], 2.0, 2.8, 0, 0, TAU); c.fill();
  c.fillStyle = 'rgba(255,255,255,0.8)'; c.beginPath(); c.arc(e[0] - 1.3, e[1] - 1.3, 0.9, 0, TAU); c.fill();
  c.strokeStyle = 'rgba(0,0,0,0.55)'; c.lineWidth = 1.2; c.beginPath(); c.ellipse(e[0], e[1], 6.5, 4.6, 0, Math.PI * 1.08, Math.PI * 1.92); c.stroke();
  c.fillStyle = 'rgba(30,16,14,0.75)'; c.beginPath(); c.ellipse(nz[0], nz[1], 3, 2, 0.2, 0, TAU); c.fill();
  c.strokeStyle = 'rgba(0,0,0,0.35)'; c.lineWidth = 0.9; c.beginPath(); c.moveTo(nz[0] - 20, nz[1] + 12); c.quadraticCurveTo(nz[0] - 10, nz[1] + 16, nz[0] - 4, nz[1] + 10); c.stroke();
}

// Faint "ghost rosettes": black panthers are spotted leopards; in moonlight the pattern just shows.
const ROSETTES = (() => {
  const r = rng(7), out = [];
  for (let x = -122; x < 128; x += 19) for (let y = -156; y < -88; y += 17) {
    const jx = x + (r() - 0.5) * 12, jy = y + (r() - 0.5) * 10;
    out.push({ x: jx, y: jy, r: 3.5 + r() * 2.8, rot: r() * TAU, gaps: 3 + Math.floor(r() * 3) });
  }
  return out;
})();
const STRANDS = (() => {          // coat texture: short hairs lying toward the tail
  const r = rng(11), a = [], b = [];
  for (let i = 0; i < 460; i++) {
    const x = -135 + r() * 285, y = -166 + r() * 100, ang = (176 + (r() - 0.5) * 26 + (y + 120) * 0.1) * DEG, len = 2.5 + r() * 3.5;
    (r() < 0.5 ? a : b).push([x, y, Math.cos(ang) * len, Math.sin(ang) * len]);
  }

})();
function strandsAlong(c, pts, halfw, n, seed) {   // hairs running down a limb

    const [ax, ay] = pts[s], [bx, by] = pts[s + 1], dx = bx - ax, dy = by - ay, L = Math.hypot(dx, dy) || 1, nx = dy / L, ny = -dx / L;
    for (let i = 0; i < n; i++) {

      const x = ax + dx * u + nx * side, y = ay + dy * u + ny * side;
      c.moveTo(x, y); c.lineTo(x + dx / L * 6, y + dy / L * 6);
    }
  }
  c.stroke();
}

// ---- the world: layout ------------------------------------------------------------
const W = canvas.width = +(params.get('w') || 720), H = canvas.height = +(params.get('h') || 1280);
let sN, yN, yF, yT, yHor, PAL, FLAT = [], UPRIGHT = [], TREES = [], FARF = [], FIREFLIES = [], FG = [], STARS = [], PARTS = [], DEST = {};
const SQ = 0.42;           // how flattened things lying on the ground look from this camera height
const LW = 9000;           // the forest floor repeats every LW world units
const sAt = y => sN * (y - yHor) / (yN - yHor);           // pixels per world unit at ground row y
const vy = v => lerp(yT, H * 1.04, v);                    // depth 0..1 → ground row
function wrapX(wx, D, s) { let d = ((wx - D) % LW + LW) % LW; if (d > LW / 2) d -= LW; return W / 2 + d * s; }
const BOX = { x0: -350, x1: 300, y0: -350, y1: 36 };      // body-unit bounds of everything a running panther draws
const FAR_UP = 12, FAR_DX = 3;     // far-side legs stand a little deeper on the ground, so a little higher on screen
function makeLayer(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }

function layout() {
  sN = W * 0.00135;
  yN = H * 0.915;
  const gap = 158 * sN;                                            // lane spacing: a panther's back clears the one behind's chest
  yF = yN - gap * 4;
  yHor = (yF - 0.8 * yN) / 0.2;                                    // the back lane is drawn at 80% of the front lane's size
  yT = yF - Math.max(H * 0.1, 120 * sAt(yF));                      // where the clearing meets the far trees
  PACK.forEach((pt, i) => {
    pt.y = lerp(yF, yN, i / 4); pt.depth = i / 4;
    pt.s = sAt(pt.y); pt.S = pt.s * pt.g;
    if (CFG.coats) { const cc = CFG.coats[i]; pt.coat = { c: cc.c, e: cc.e, dark: (0.3 * cc.c[0] + 0.59 * cc.c[1] + 0.11 * cc.c[2]) > 150 }; } else if (!pt.coat) pt.coat = null;   // a coloured coat (light coats get dark whiskers)
    const S = pt.S, pad = Math.ceil(8 * S + 6);
    pt.w = Math.ceil((BOX.x1 - BOX.x0) * S) + pad * 2;
    pt.h = Math.ceil((BOX.y1 - BOX.y0) * S) + pad * 2;
    pt.ox = pad - BOX.x0 * S; pt.oy = pad - BOX.y0 * S;
    [pt.mBody, pt.cBody] = makeLayer(pt.w, pt.h);
    [pt.mRim, pt.cRim] = makeLayer(pt.w, pt.h);
    [pt.mFar, pt.cFar] = makeLayer(pt.w, pt.h);
    const k = Math.max(2, Math.round(2.4 * S));                    // shrink factor ≈ the bloom radius in pixels
    [pt.mSmall, pt.cSmall] = makeLayer(Math.ceil(pt.w / k), Math.ceil(pt.h / k));
    pt.cSmall.imageSmoothingQuality = 'high';
  });
  buildScene();
}

function palAt(t) {            // the sunrise version changes its whole light over the video
  if (CYC) return cycPal(t);
  if (!CFG.pal2) return CFG.pal;
  const u = smooth(clamp(t / (DUR - 2)));
  const o = {}; for (const k in CFG.pal) o[k] = mixAny(CFG.pal[k], CFG.pal2[k], u);
  return o;
}

function buildScene() {
  const r = rng(CFG.seed);
  FLAT = []; UPRIGHT = []; TREES = []; FARF = []; FIREFLIES = []; FG = []; PARTS = []; DEST = {};
  const nk = LW / 6000;
  for (let i = 0; i < 70 * nk; i++) FLAT.push({ k: 'soil', wx: r() * LW, v: r() * 1.02, r: 50 + r() * 150, a: 0.05 + r() * 0.07, sx: 1 + r() * 1.2 });
  for (let i = 0; i < 26 * nk; i++) FLAT.push({ k: 'moss', wx: r() * LW, v: r(), r: 40 + r() * 110, a: 0.2 + r() * 0.2, sx: 1 + r() * 0.8 });
  for (let i = 0; i < 30 * nk; i++) FLAT.push({ k: 'pool', wx: r() * LW, v: 0.04 + r() * 0.96, r: 130 + r() * 190, a: 0.1 + r() * 0.1, sx: 1.2 + r() * 0.6 });
  for (let i = 0; i < 520 * nk; i++) FLAT.push({ k: 'leaf', wx: r() * LW, v: r() * 1.02, r: 5 + r() * 8, rot: r() * TAU, a: 0.05 + r() * 0.08 });
  for (let i = 0; i < 420 * nk; i++) UPRIGHT.push({ k: 'tuft', wx: r() * LW, v: r() * 1.02, h: 6 + r() * 15, n: 3 + Math.floor(r() * 5), seed: Math.floor(r() * 1e6) });
  for (let i = 0; i < 46 * nk; i++) UPRIGHT.push({ k: 'stone', wx: r() * LW, v: r() * 1.02, r: 4 + r() * 9, seed: Math.floor(r() * 1e6) });
  for (let i = 0; i < 30 * nk; i++) UPRIGHT.push({ k: 'twig', wx: r() * LW, v: r() * 1.02, len: 18 + r() * 30, rot: (r() - 0.5) * 1.2, seed: Math.floor(r() * 1e6) });
  if (CFG.flowers) for (let i = 0; i < 360 * nk; i++) UPRIGHT.push({ k: 'flower', wx: r() * LW, v: r() * 1.02, h: 8 + r() * 12, c: Math.floor(r() * CFG.flowers.length), seed: Math.floor(r() * 1e6) });
  if (CFG.ferns !== false) for (let i = 0; i < 22 * nk; i++) UPRIGHT.push({ k: 'fern', wx: r() * LW, v: r() * 0.09, s: 0.45 + r() * 0.45, seed: Math.floor(r() * 1e6) });
  for (const it of FLAT) it.y = vy(it.v);
  for (const it of UPRIGHT) it.y = vy(it.v);
  UPRIGHT.sort((a, b) => a.y - b.y);
  const [e0, e1] = CFG.treeEvery || [1000, 2000];      // big trunks standing along the far edge of the clearing
  if (CFG.trees !== false) for (let x = 0; x < LW; x += e0 + r() * (e1 - e0)) TREES.push({ wx: x, y: yT + (r() - 0.35) * 22 * sN, w: 26 + r() * 44, seed: Math.floor(r() * 1e6), vines: Math.floor(r() * 3) });
  TREES.sort((a, b) => a.y - b.y);
  const span = W * 2.4, sT = sAt(yT), yC = yT * 0.66;      // deeper forest: hazy trunks under a ragged canopy line (screen-space strip, slower)
  for (let x = 0; x < span; x += (30 + r() * 60) * sT) FARF.push({ x, w: (5 + r() * 12) * sT, lean: (r() - 0.5) * 0.06, top: yC + (r() - 0.3) * yT * 0.12,
    clumps: Array.from({ length: 3 + Math.floor(r() * 4) }, () => [(r() - 0.5) * 120 * sT, yC + (r() - 0.45) * yT * 0.18, (20 + r() * 34) * sT]) });
  FARF.span = span;
  if (CFG.fire) for (let i = 0; i < CFG.fire.n; i++) FIREFLIES.push({ wx: r() * LW, v: 0.02 + r() * 0.9, h: 25 + r() * 150, ph: r() * TAU, k: 1 + Math.floor(r() * 4), dr: 10 + r() * 25 });
  const fspan = W + 1400 * sN;
  for (let x = 0; x < fspan; x += (420 + r() * 700) * sN) FG.push({ x, s: 0.8 + r() * 0.6, seed: Math.floor(r() * 1e6) });
  FG.span = fspan;
